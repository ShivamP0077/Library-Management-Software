<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Library & Study Hall Management System</title>
  
  <script>
    window.addEventListener("error", function(e) {
      fetch("http://localhost:4000", { method: "POST", body: e.message + " " + e.filename + ":" + e.lineno });
    });
    window.addEventListener("unhandledrejection", function(e) {
      fetch("http://localhost:4000", { method: "POST", body: "Promise rejection: " + (e.reason ? e.reason.message : 'Unknown') });
    });
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/index.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Vite entry -->

</body>
</html>
